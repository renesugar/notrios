    SelectionPlanRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: { type: string, enum: [full_archive, subset_transfer, publication_handoff] }
        selection: { $ref: '#/components/schemas/SelectionSpec' }
        policy: { $ref: '#/components/schemas/PrivacyPolicy' }
        detail_limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        max_documents: { type: integer, minimum: 1, maximum: 100000, default: 100000 }
    SelectionPlan:
      type: object
      required: [version, target, policy, manifest_sha256, counts, documents, resources, links, source_bundles, exclusions, metadata_decisions, warnings, truncated]
      properties:
        version: { type: integer, enum: [1] }
        target: { type: string, enum: [full_archive, subset_transfer, publication_handoff] }
        policy:
          type: object
          additionalProperties: true
        manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        counts:
          type: object
          additionalProperties: true
        documents:
          type: array
          items: { type: object, additionalProperties: true }
        resources:
          type: array
          items: { type: object, additionalProperties: true }
        links:
          type: array
          items: { type: object, additionalProperties: true }
        source_bundles:
          type: array
          items: { type: object, additionalProperties: true }
        exclusions:
          type: array
          items: { type: object, additionalProperties: true }
        metadata_decisions:
          type: array
          items: { type: object, additionalProperties: true }
        warnings:
          type: array
          items: { type: string }
        truncated: { type: boolean }
    JobStatus:
      type: object
      required: [id, kind, status]
