server:
  listen_addr: "127.0.0.1:8080"
  public_base_url: "http://127.0.0.1:8080"
  # Directory holding the built web interface (the one containing index.html).
  # Leave it unset to search web/dist under the working directory, then under
  # the executable's own directory and its parent — which covers running
  # bin/notrios from the checkout root or from inside bin/. Set it when the
  # binary lives apart from its assets.
  # web_dir: "/opt/notrios/web/dist"

data:
  directory: "./data"
  database_path: "./data/notes.sqlite"
  asset_store: "./data/assets"
  projection_dir: "./data/projections"

# `notriosctl profile create` writes a separate owner-only config with a local
# profile identity, absolute isolated paths, and one of these targets. The
# ordinary checkout config is unmanaged and safely keeps synchronization off.
# Changing a managed profile to directory/rest establishes its sequence-zero
# local journal boundary; transfer remains a later v0.7 slice.
sync:
  target: "none"                 # none | directory | rest

search:
  default_limit: 20
  max_limit: 100

mcp:
  enabled: true
  # Which tools an MCP client sees and may call: search-only, read-only,
  # editor, or organizer. Empty means read-only.
  #
  # This is a guardrail you place on your own agent, not authorization —
  # Notrios is single-user, and this key lives in the file you control. It is
  # not what keeps the endpoint safe; keeping the service on loopback is.
  #
  # `default_profile` is the deprecated former name and is still read. If both
  # appear, the narrower of the two wins and the service logs it, because a key
  # that quietly stops applying must never widen what an agent may do.
  default_scope: "read-only"
  max_results: 10
  max_document_bytes: 65536

remote_media:
  default_action: "review"       # allow | block | review (review = report, never auto-download)
  allow_private_networks: false
  max_redirects: 5
  fetch_timeout_seconds: 30
  quarantine_dir: "./data/quarantine"
  blocked_schemes: ["file", "ftp", "data"]
  review_domains: []
  blocked_domains:
    - "*.example-blocked.invalid"
  allowed_domains:
    - "wikipedia.org"
    - "*.wikimedia.org"
    - "github.com"
    - "raw.githubusercontent.com"
  max_bytes:
    image: "20MB"
    video: "200MB"
    pdf: "100MB"

retention:
  unreferenced_resource_days: 30  # unattached uploads and explicitly detached resources
  purged_resource_days: 90        # resources orphaned by permanent note purge

search_sidecar:
  enabled: false
  binary: "recollindex"
  index_dir: "./data/search-index"
