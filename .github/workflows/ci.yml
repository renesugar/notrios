name: CI

on:
  push:
  pull_request:

# Least privilege, declared rather than inherited. Without this block a workflow
# gets the repository's default token permissions, which can be read/write for
# every scope; nothing in CI writes to the repository.
permissions:
  contents: read

# A runner is thrown away after the job, so bytecode left on it harms nothing.
# These are set for the other reason: unbuffered output means a failing step's
# log ends where the failure happened rather than wherever the buffer flushed,
# and the same environment everywhere means a script behaves here as it does on
# a workstation.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      # scripts/validate-scaffold.sh is this repository's `make validate`, and
      # it needs the web workspace's TypeScript to audit the frontend. This job
      # ran it without ever installing those dependencies, so the audit died on
      # MODULE_NOT_FOUND -- invisible until CI ran the script at all.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: go vet ./...
      - run: go test ./...
      - run: python3 performance/v0.7-g18d/validate_evidence.py
      - run: python3 performance/v0.7-g18e/validate_evidence.py
      - run: make g18f-validate
      - run: python3 performance/v0.7-g18g/validate_evidence.py
      - run: make g19-validate
      - run: make g20-validate
      - run: python3 scripts/check_required_files.py
      - run: bash scripts/validate-scaffold.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # One source of truth for the Node version, so CI cannot drift from
          # the machine the tests were written on. That skew hid a broken test
          # for four milestones: it asserted a refusal that never happened, and
          # only failed once CI ran it on a different Node.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - run: cd web && npm ci
      - run: cd web && npm audit
      - run: python3 performance/v0.7-g18c/validate_evidence.py
      - run: make g18e-validate
      - run: cd web && npm run typecheck
      - run: cd web && npm test -- --run
      - run: cd web && npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - run: cd web && npm ci && npm run build
      - run: bash scripts/mvp_smoke.sh
      - run: bash scripts/run_performance_smoke.sh

  gui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Compile the notrios GUI binary
        run: go build -tags "gui desktop production webkit2_41" ./cmd/notrios
