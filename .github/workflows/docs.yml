name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'docs-site/**', 'contracts/archive-v2/**', 'internal/docgen/**', 'internal/docaudit/**', 'performance/v0.7-g18g/**', 'scripts/build_docs_site.sh', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.164.0'
          extended: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Verify generated documentation freshness
        run: go test ./internal/docgen -run '^TestDocsAreCurrent$'
      - name: Install pinned Pagefind build dependency
        run: npm ci --prefix docs-site && npm audit --prefix docs-site
      - name: Build pinned Hugo/Ledger site with Pagefind search
        run: bash scripts/build_docs_site.sh _site
      - name: Verify routes, fragments, search scope, and offline assets
        run: python3 performance/v0.7-g18g/validate_evidence.py --site _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
