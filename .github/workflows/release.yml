name: release

# Build the Ubuntu package where its provenance can be attested.
#
# v0.9 I6 produced an in-toto provenance statement and recorded its own limit: a
# statement this repository wrote about its own build, on a workstation, with no
# builder identity anybody else can check. An attestation closes that half, and
# it can only attest what a workflow built -- so moving the build here is the
# prerequisite rather than the polish.
#
# It runs from a release tag, or by hand for a rehearsal. It does not publish
# anything: the artifact stays a run artifact until v1.0 J10 authorises a
# release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege at the top; the package job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# A runner is thrown away after the job, so bytecode left on it harms nothing.
# These are set for the other reason: unbuffered output means a failing step's
# log ends where the failure happened rather than wherever the buffer flushed,
# and the same environment everywhere means a script behaves here as it does on
# a workstation.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  package:
    runs-on: ubuntu-latest
    # The environment is what restricts which refs can reach this job at all:
    # `production` admits `main` and tags matching `v*` and nothing else. It
    # holds the release signing key for J2; this job uses no secret, because an
    # attestation needs none -- id-token is a per-run OIDC token rather than
    # stored credential, which is a large part of the appeal.
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # dpkg-dev for the packaging tools build_deb.sh requires; libsqlite3-dev
      # because the store is a cgo wrapper; the GTK and webkit headers because
      # the package ships the desktop GUI.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      # A tag says which version is being released and version.go says which
      # version is being built. If they disagree, the release is mislabelled --
      # so this refuses rather than publishing notrios_0.8.0 under a v1.0.0 tag.
      - name: Check the tag matches the product version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          product=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' internal/version/version.go)
          tag=${GITHUB_REF#refs/tags/v}
          echo "tag=$tag product version=$product"
          if [ "$tag" != "$product" ]; then
            echo "::error::tag v$tag does not match internal/version/version.go ($product)" >&2
            exit 1
          fi

      # `make deb`, not build_deb.sh directly: a workflow and a developer should
      # run the same thing, which is the rule that script's own header states.
      - name: Build the package
        run: make deb

      # build_deb.sh builds the GUI conditionally and carries on without it when
      # the headers are missing -- it prints "no desktop GUI" and still produces
      # a package. That is right for a developer without GTK and wrong for a
      # release, where it would ship a quietly smaller package. So assert what
      # the package actually carries.
      - name: Check the package carries every binary
        run: |
          deb=$(ls dist/deb/notrios_*_amd64.deb)
          echo "package: $deb"
          contents=$(dpkg-deb -c "$deb" | awk '{print $6}')
          for binary in ./usr/bin/notrios ./usr/bin/notriosd ./usr/bin/notriosctl; do
            if ! grep -qx -- "$binary" <<<"$contents"; then
              echo "::error::the package does not contain $binary" >&2
              exit 1
            fi
            echo "  present: $binary"
          done
          sha256sum "$deb"

      - name: Attest the package
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/deb/notrios_*_amd64.deb

      - name: Assemble the release set
        run: python3 performance/v0.9-i6/build_release_set.py --signed

      # Imported inline rather than through an action.
      #
      # A third-party action would be the component handling the most sensitive
      # material in this pipeline, and importing a key is one command. H6a's
      # rule was the smallest maintainable toolchain, and this is where that rule
      # is worth the most. The key carries no passphrase -- deliberately, because
      # a passphrase stored beside the key it unlocks adds no layer and `gpg
      # --batch` cannot answer a prompt -- so no second secret is needed.
      - name: Import the release signing key
        env:
          RELEASE_KEY: ${{ secrets.GPG_RELEASE_PRIVATE_KEY }}
        run: |
          printf '%s' "$RELEASE_KEY" | gpg --batch --quiet --import
          # The key that signs must be the key the repository publishes.
          published=$(gpg --batch --with-colons --fingerprint --import-options show-only \
                        --import keys/release-public.asc | awk -F: '/^fpr/{print $10; exit}')
          imported=$(gpg --batch --with-colons --fingerprint --list-secret-keys \
                        | awk -F: '/^fpr/{print $10; exit}')
          if [ "$published" != "$imported" ]; then
            echo "::error::the imported key $imported is not the published key $published" >&2
            exit 1
          fi

          # The secret carries the signing subkey, not the primary key.
          #
          # The fingerprint check above cannot see the difference: a
          # --export-secret-subkeys export still imports a stub for the primary,
          # so the first fpr line is the primary fingerprint either way. What
          # distinguishes them is field 15 of the sec record -- '+' when the
          # primary's secret material is present, '#' when it is only a stub --
          # measured on a throwaway key rather than read off a manual page. The
          # signing subkey's own secret must be present, which is the same field
          # on the ssb record that advertises the sign capability.
          #
          # Fail-closed and here rather than in review: a secret nobody can read
          # back is exactly the kind of claim that needs a gate rather than a
          # note saying it was done.
          colons=$(gpg --batch --with-colons --list-secret-keys)
          primary=$(printf '%s\n' "$colons" | awk -F: '$1=="sec"{print $15; exit}')
          if [ "$primary" != "#" ]; then
            echo "::error::the release secret carries the primary key's secret material" \
                 "(sec field 15 is '$primary', want '#'). Re-export it with" \
                 "gpg --export-secret-subkeys so a compromised runner cannot certify" \
                 "new subkeys or new identities." >&2
            exit 1
          fi
          subkey=$(printf '%s\n' "$colons" | awk -F: '$1=="ssb" && $12 ~ /s/ {print $15; exit}')
          if [ "$subkey" != "+" ]; then
            echo "::error::no signing subkey secret in the release secret (ssb field 15 is" \
                 "'$subkey', want '+'), so nothing here can sign." >&2
            exit 1
          fi
          echo "signing key: $imported (primary stubbed, signing subkey present)"

      - name: Sign the release set
        run: |
          cd dist/release-set
          deb=$(ls notrios_*_amd64.deb)
          gpg --batch --yes --armor --detach-sign --output "$deb.asc" "$deb"

          # RFC 3161 over the signature, from the authority and policy this
          # project already pins for its evidence reserve -- one verification
          # story rather than two. A signature says who; a timestamp keeps
          # saying when after the key expires or is revoked.
          openssl ts -query -data "$deb.asc" -sha256 -cert -out "$deb.asc.tsq"
          curl -sSf -H 'Content-Type: application/timestamp-query' \
               --data-binary "@$deb.asc.tsq" http://timestamp.digicert.com \
               -o "$deb.asc.tsr"
          openssl ts -verify -data "$deb.asc" -in "$deb.asc.tsr" \
               -CAfile "$GITHUB_WORKSPACE/evidence/current/TRUST/tsa-root.pem" \
               -untrusted "$GITHUB_WORKSPACE/evidence/current/TRUST/tsa-untrusted.pem"

          # The checksum file is written last over everything above, then signed:
          # it cannot cover its own signature.
          sha256sum notrios_*_amd64.deb notrios_*.asc notrios_*.tsq notrios_*.tsr \
                    SBOM.cdx.json PROVENANCE.json > SHA256SUMS
          gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

      # The same verification a stranger runs, against the same committed key,
      # before the artifact leaves the runner.
      - name: Verify the release set the way a downloader would
        run: |
          python3 performance/v0.9-i6/verify_release_set.py \
            --set dist/release-set --public-key keys/release-public.asc

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: notrios-release-set
          path: dist/release-set/*
          if-no-files-found: error
