  - main [ref=f2e16]:
    - heading "Notrios" [level=1] [ref=f2e17]
    - paragraph [ref=f2e18]: Notrios is a local-first note-taking, search, import, and publishing system for very large Markdown and document collections. Your notes live in a SQLite database on your machine; search, notebooks, tags, revisions, and attachments all work offline.
    - heading "Highlights" [level=2] [ref=f2e19]
    - list [ref=f2e20]:
      - listitem [ref=f2e21]:
        - strong [ref=f2e22]: Local first
        - text: — one SQLite file is the canonical store; full-text search (FTS5) is built in, and the optional
        - link "Recoll sidecar" [ref=f2e23] [cursor=pointer]:
          - /url: service.html#search-sidecar
        - text: adds field search over front matter and attached files.
      - listitem [ref=f2e24]:
        - strong [ref=f2e25]: Notebooks and tags
        - text: — nested notebooks with emoji icons, tags with live counts, and query-backed
        - emphasis [ref=f2e26]: search notebooks
        - text: ("All notes", "Trash", and your own saved searches like
        - code [ref=f2e27]: tag:todo
        - text: ).
      - listitem [ref=f2e28]:
        - strong [ref=f2e29]: A real query language
        - text: —
        - code [ref=f2e30]: notebook:"Work"
        - text: ","
        - code [ref=f2e31]: tag:"shopping mall"
        - text: ","
        - code [ref=f2e32]: author:"Alice Smith"
        - text: ","
        - code [ref=f2e33]: since:2026-07-01
        - text: ", quoted phrases, and more. See the"
        - link "query language" [ref=f2e34] [cursor=pointer]:
          - /url: query-language.html
        - text: .
      - listitem [ref=f2e35]:
        - strong [ref=f2e36]: Importers
        - text: — Joplin RAW, Obsidian vaults, Twitter/X archives (with conversation threads), ChatGPT exports, and Claude exports. See
        - link "import & export" [ref=f2e37] [cursor=pointer]:
          - /url: import-export.html
        - text: .
      - listitem [ref=f2e38]:
        - strong [ref=f2e39]: Open APIs
        - text: — a REST API and an MCP endpoint complete enough to build a full third-party client. See the
        - link "REST" [ref=f2e40] [cursor=pointer]:
          - /url: api/rest.html
        - text: and
        - link "MCP" [ref=f2e41] [cursor=pointer]:
          - /url: api/mcp.html
        - text: guides.
      - listitem [ref=f2e42]:
        - strong [ref=f2e43]: Built-in GUI
        - text: — a Go/Wails desktop app with a notebooks sidebar, incremental search, Markdown editor/preview, and light/dark/custom themes. See the
        - link "GUI guide" [ref=f2e44] [cursor=pointer]:
          - /url: gui.html
        - text: .
    - heading "Getting started" [level=2] [ref=f2e45]
    - code [ref=f2e47]: "# Headless service go run ./cmd/notriosd -config config/config.example.yaml # Desktop GUI (one binary containing the GUI and the service) make gui && ./bin/notrios"
    - paragraph [ref=f2e48]:
      - text: Then open
      - link "http://127.0.0.1:8080" [ref=f2e49] [cursor=pointer]:
        - /url: http://127.0.0.1:8080
      - text: in a browser (headless mode) or use the GUI window. The
      - link "service guide" [ref=f2e50] [cursor=pointer]:
        - /url: service.html
      - text: covers configuration; the
      - link "CLI guide" [ref=f2e51] [cursor=pointer]:
        - /url: cli.html
      - text: covers imports and exports.
    - heading "License" [level=2] [ref=f2e52]
    - paragraph [ref=f2e53]: Notrios is licensed under the Apache License 2.0.